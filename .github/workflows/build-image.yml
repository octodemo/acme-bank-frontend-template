name: build-image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, SBOM, and attest image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    env:
      IMAGE_NAME: acme-frontend
      LOCAL_IMAGE_REF: acme-frontend:sha-${{ github.sha }}
      ACR_LOGIN_SERVER: ${{ vars.SHARED_ACR_LOGIN_SERVER }}
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build image
        run: docker build -t "$LOCAL_IMAGE_REF" -f Dockerfile .
      - name: Generate SPDX SBOM (microsoft/sbom-tool)
        shell: bash
        run: |
          curl -sSL -o sbom-tool https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-linux-x64
          chmod +x sbom-tool
          mkdir -p _sbom
          ./sbom-tool generate \
            -di "$LOCAL_IMAGE_REF" \
            -b ./_sbom \
            -bc . \
            -pn "$IMAGE_NAME" \
            -pv "sha-${{ github.sha }}" \
            -ps "Acme Bank" \
            -nsb "https://acmebank.example/$IMAGE_NAME"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-acme-frontend
          path: _sbom/_manifest/spdx_2.2/
      - name: Azure login (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to ACR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          acr_name="${ACR_LOGIN_SERVER%%.azurecr.io}"
          az acr login --name "$acr_name"
      - name: Push image (main only)
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          remote_image_ref="$ACR_LOGIN_SERVER/$IMAGE_NAME:sha-${{ github.sha }}"
          docker tag "$LOCAL_IMAGE_REF" "$remote_image_ref"
          docker push "$remote_image_ref"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$remote_image_ref" | cut -d@ -f2)
          if [[ -z "$digest" ]]; then
            echo "::error::Failed to capture pushed digest for $remote_image_ref" && exit 1
          fi
          echo "image-ref=$remote_image_ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Capture local digest (PR only)
        id: local
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          digest=$(docker image inspect "$LOCAL_IMAGE_REF" --format='{{.Id}}' | sed 's/^sha256:/sha256:/')
          echo "image-ref=$LOCAL_IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Resolve image outputs
        id: digest
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "digest=${{ steps.local.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve image ref
        id: image
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "image-ref=${{ steps.push.outputs.image-ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "image-ref=${{ steps.local.outputs.image-ref }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Attest build provenance (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: 'https://spdx.dev/Document/v2.2'
          predicate-path: _sbom/_manifest/spdx_2.2/manifest.spdx.json
          push-to-registry: true
      - name: Write image digest artifact (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          jq -n \
            --arg imageRef "${{ steps.push.outputs.image-ref }}" \
            --arg digest "${{ steps.push.outputs.digest }}" \
            '{imageRef: $imageRef, digest: $digest}' > image-digest.json
      - name: Upload image digest artifact (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest
          path: image-digest.json

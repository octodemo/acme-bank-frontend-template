# yaml-language-server: $schema=https://aka.ms/azure-dev/azure.yaml.json
name: acme-frontend
metadata:
  template: acme-bank-frontend-template@0.0.1
infra:
  provider: bicep
# preup hook seeds the azd env with the existing Acme Bank platform
# defaults so `azd up` runs without prompts. The top-level `resourceGroup:`
# property in azure.yaml is currently broken (Azure/azure-dev#4287); preup runs
# before any prompts so AZURE_RESOURCE_GROUP is seeded in time.
hooks:
  preup:
    posix:
      shell: sh
      run: |
        azd env set AZURE_SUBSCRIPTION_ID f5f55b09-c75c-4bc0-8097-4b2378d7fcde
        azd env set AZURE_RESOURCE_GROUP rg-acmebank
        azd env set AZURE_LOCATION westus3
        azd env set SERVICE_NAME "$(basename "$PWD")"
    windows:
      shell: pwsh
      run: |
        azd env set AZURE_SUBSCRIPTION_ID f5f55b09-c75c-4bc0-8097-4b2378d7fcde
        azd env set AZURE_RESOURCE_GROUP rg-acmebank
        azd env set AZURE_LOCATION westus3
        azd env set SERVICE_NAME (Split-Path -Leaf (Get-Location))
services:
  web:
    project: .
    language: ts
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

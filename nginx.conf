worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location /api/ {
      proxy_pass @BFF_BASE_URL@/api/;
      proxy_http_version 1.1;
      # Container Apps' fronting infra routes by SNI + Host header, so both
      # must be the BFF's external FQDN — not nginx's listen name. Without
      # proxy_ssl_server_name, nginx omits SNI and Container Apps responds
      # with 502 Bad Gateway.
      proxy_ssl_server_name on;
      proxy_ssl_name $proxy_host;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
